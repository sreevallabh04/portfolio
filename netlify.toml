[build]
  # --include=dev is what actually matters here: Vite and the build plugins are
  # devDependencies, so they must be installed for `vite build` to run.
  #
  # This used to be achieved with NODE_ENV = "development" in the environment
  # below, which had a much larger side effect than intended — it put React
  # into development mode for the production bundle. Measured: 1,751,825 bytes
  # of JS with 11 React dev-only warning strings, against 1,396,892 bytes and
  # zero without it. That is 355 kB of dead weight plus a dev-mode React, which
  # is several times slower at runtime and double-renders under StrictMode.
  command = "npm ci --include=dev && npx vite build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames change whenever content changes, so they can be cached
# indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
